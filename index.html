<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>Project Cost Manager</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f1f5f9;color:#0f172a}
header{background:#0f172a;color:white;padding:18px 16px;position:sticky;top:0;z-index:5}
h1,h2,h3,p{margin:0}.sub{opacity:.75;font-size:13px;margin-top:4px}
main{max-width:900px;margin:auto;padding:16px 14px 90px}
.card{background:white;border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 2px 10px #0000000b}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat{background:#f8fafc;border-radius:12px;padding:11px}.label{font-size:11px;color:#64748b}.value{font-weight:700;margin-top:3px;font-size:13px;word-break:break-word}
.project{display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr;gap:7px;align-items:center;padding:12px 8px;border-top:1px solid #e2e8f0;cursor:pointer}
.project:first-of-type{border-top:0}.project:hover{background:#f8fafc}.money{font-size:12px}
.btn{border:0;border-radius:12px;padding:11px 15px;font-weight:700;cursor:pointer}.primary{background:#2563eb;color:white}.danger{background:#fee2e2;color:#b91c1c}.ghost{background:#e2e8f0;color:#0f172a}
.fab{position:fixed;right:18px;bottom:20px;width:56px;height:56px;border-radius:50%;border:0;background:#2563eb;color:#fff;font-size:28px;box-shadow:0 8px 25px #2563eb55}
.back{background:none;border:0;color:white;font-size:16px;padding:0 10px 0 0}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.muted{color:#64748b;font-size:13px}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:9px 5px;border-bottom:1px solid #e2e8f0}th{color:#64748b;font-size:11px}
.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:flex-end;justify-content:center;z-index:10}.modalbox{background:white;width:100%;max-width:600px;border-radius:20px 20px 0 0;padding:20px;max-height:90vh;overflow:auto}
input,select,textarea{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px;margin-top:5px;font:inherit}label{display:block;font-size:12px;color:#475569;margin-top:10px}
.actions{display:flex;gap:8px;margin-top:16px}.actions>*{flex:1}
.hidden{display:none}.section-title{font-weight:800;margin-bottom:10px}
@media(max-width:600px){.grid{grid-template-columns:repeat(2,1fr)}.project{grid-template-columns:1.4fr 1fr 1fr 1fr}.money{font-size:10px}}
</style>
</head>
<body>
<header id="header">
  <div class="row"><div><h1>PROJECT COST MANAGER</h1><div class="sub">Kontrol biaya proyek pribadi</div></div></div>
</header>
<main id="app"></main>
<button class="fab" onclick="openProject()">+</button>

<div id="modal" class="modal hidden">
<div class="modalbox" id="modalbox"></div>
</div>

<script>
const KEY='pcm_projects_v1';
let projects=JSON.parse(localStorage.getItem(KEY)||'null')||[
 {id:crypto.randomUUID(),name:'PROJECT 1',value:0,note:'',items:[]},
 {id:crypto.randomUUID(),name:'PROJECT 2',value:0,note:'',items:[]},
 {id:crypto.randomUUID(),name:'PROJECT 3',value:0,note:'',items:[]}
];
let selected=null;

function save(){localStorage.setItem(KEY,JSON.stringify(projects))}
function rupiah(n){return new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(n||0)}
function total(p,type){return p.items.filter(x=>x.type===type).reduce((a,x)=>a+(+x.qty||0)*(+x.price||0),0)}
function costs(p){return total(p,'MATERIAL')+total(p,'UPAH')+total(p,'BOP')}
function profit(p){return (+p.value||0)-costs(p)}

function render(){
 if(selected){renderDetail();return}
 document.getElementById('header').innerHTML='<div><h1>DASHBOARD</h1><div class="sub">Material • Upah • BOP • Laba</div></div>';
 let rows=projects.map(p=>`<div class="project" onclick="selectProject('${p.id}')">
 <b>${esc(p.name)}</b><span class="money">${rupiah(total(p,'MATERIAL'))}</span><span class="money">${rupiah(total(p,'UPAH'))}</span><span class="money">${rupiah(total(p,'BOP'))}</span></div>`).join('');
 document.getElementById('app').innerHTML=`
 <div class="card"><div class="grid">
  <div class="stat"><div class="label">PROJECT</div><div class="value">${projects.length}</div></div>
  <div class="stat"><div class="label">NILAI PROYEK</div><div class="value">${rupiah(projects.reduce((a,p)=>a+(+p.value||0),0))}</div></div>
  <div class="stat"><div class="label">TOTAL BIAYA</div><div class="value">${rupiah(projects.reduce((a,p)=>a+costs(p),0))}</div></div>
  <div class="stat"><div class="label">EST. LABA</div><div class="value">${rupiah(projects.reduce((a,p)=>a+profit(p),0))}</div></div>
 </div></div>
 <div class="card"><div class="section-title">Daftar Proyek</div>
 <div class="project" style="cursor:default;font-size:11px;color:#64748b"><b>PROJECT</b><b>MATERIAL</b><b>UPAH</b><b>BOP</b></div>${rows}</div>`;
}
function renderDetail(){
 let p=projects.find(x=>x.id===selected); if(!p){selected=null;render();return}
 document.getElementById('header').innerHTML=`<div class="row"><div><button class="back" onclick="selected=null;render()">← Dashboard</button><h1>${esc(p.name)}</h1><div class="sub">Detail proyek</div></div></div>`;
 document.getElementById('app').innerHTML=`
 <div class="card"><div class="grid">
 <div class="stat"><div class="label">NILAI PROYEK</div><div class="value">${rupiah(p.value)}</div></div>
 <div class="stat"><div class="label">MATERIAL</div><div class="value">${rupiah(total(p,'MATERIAL'))}</div></div>
 <div class="stat"><div class="label">UPAH</div><div class="value">${rupiah(total(p,'UPAH'))}</div></div>
 <div class="stat"><div class="label">BOP</div><div class="value">${rupiah(total(p,'BOP'))}</div></div>
 </div></div>
 <div class="card"><div class="row"><div><div class="label">TOTAL BIAYA</div><h2>${rupiah(costs(p))}</h2></div><div style="text-align:right"><div class="label">ESTIMASI LABA</div><h2>${rupiah(profit(p))}</h2></div></div>
 ${p.note?`<p class="muted" style="margin-top:10px">Catatan: ${esc(p.note)}</p>`:''}</div>
 <div class="card"><div class="row"><div class="section-title">Rincian Biaya</div><button class="btn primary" onclick="openCost()">+ Biaya</button></div>
 ${p.items.length?`<table><thead><tr><th>Nama</th><th>Jenis</th><th>Qty</th><th>Total</th><th></th></tr></thead><tbody>
 ${p.items.map(x=>`<tr><td>${esc(x.name)}</td><td>${x.type}</td><td>${x.qty} ${esc(x.unit)}</td><td>${rupiah((+x.qty||0)*(+x.price||0))}</td><td><button class="btn danger" onclick="delItem('${x.id}')">×</button></td></tr>`).join('')}</tbody></table>`:'<p class="muted">Belum ada biaya. Tekan + Biaya untuk menambahkan.</p>'}</div>
 <div class="card"><button class="btn ghost" onclick="editProject()">Edit Project</button> <button class="btn danger" onclick="deleteProject()">Hapus Project</button></div>`;
}
function openProject(edit=false){
 let p=edit?projects.find(x=>x.id===selected):null;
 showModal(`<h2>${edit?'Edit':'Tambah'} Project</h2>
 <label>Nama project<input id="pn" value="${escAttr(p?.name||'')}"></label>
 <label>Nilai proyek<input id="pv" type="number" value="${p?.value||0}"></label>
 <label>Keterangan<textarea id="pt">${esc(p?.note||'')}</textarea></label>
 <div class="actions"><button class="btn ghost" onclick="closeModal()">Batal</button><button class="btn primary" onclick="saveProject(${edit?'true':'false'})">Simpan</button></div>`);
}
function saveProject(edit){
 let name=document.getElementById('pn').value.trim(),value=+document.getElementById('pv').value||0,note=document.getElementById('pt').value;
 if(!name)return alert('Nama project wajib diisi');
 if(edit){let p=projects.find(x=>x.id===selected);Object.assign(p,{name,value,note})}else projects.push({id:crypto.randomUUID(),name,value,note,items:[]});
 save();closeModal();render();
}
function editProject(){openProject(true)}
function deleteProject(){if(confirm('Hapus project ini?')){projects=projects.filter(x=>x.id!==selected);selected=null;save();render()}}
function selectProject(id){selected=id;render()}
function openCost(){
 showModal(`<h2>Tambah Biaya</h2>
 <label>Nama<input id="cn"></label>
 <label>Jenis<select id="ct"><option value="MATERIAL">MATERIAL</option><option value="UPAH">UPAH</option><option value="BOP">BOP</option></select></label>
 <label>Qty<input id="cq" type="number" value="1" step="any"></label>
 <label>Satuan<input id="cu" value="unit"></label>
 <label>Harga satuan<input id="cp" type="number" value="0" step="any"></label>
 <div class="actions"><button class="btn ghost" onclick="closeModal()">Batal</button><button class="btn primary" onclick="saveCost()">Simpan</button></div>`);
}
function saveCost(){
 let name=document.getElementById('cn').value.trim();if(!name)return alert('Nama wajib diisi');
 let p=projects.find(x=>x.id===selected);p.items.push({id:crypto.randomUUID(),name,type:document.getElementById('ct').value,qty:+document.getElementById('cq').value||0,unit:document.getElementById('cu').value,price:+document.getElementById('cp').value||0});
 save();closeModal();render();
}
function delItem(id){let p=projects.find(x=>x.id===selected);if(confirm('Hapus biaya ini?')){p.items=p.items.filter(x=>x.id!==id);save();render()}}
function showModal(html){document.getElementById('modalbox').innerHTML=html;document.getElementById('modal').classList.remove('hidden')}
function closeModal(){document.getElementById('modal').classList.add('hidden')}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function escAttr(s){return esc(s).replace(/`/g,'&#96;')}
render();
</script>
</body>
</html>
